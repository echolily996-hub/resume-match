name: resume-match
services:
  db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resume_match}
      POSTGRES_USER: ${POSTGRES_USER:-resume_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env before starting}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-resume_match}
      POSTGRES_USER: ${POSTGRES_USER:-resume_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env before starting}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:5173,http://localhost:8080,http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      SEED_USER_A: ${SEED_USER_A:-demo_a}
      SEED_PASSWORD_A: ${SEED_PASSWORD_A:-Demo-A-2026!}
      SEED_USER_B: ${SEED_USER_B:-demo_b}
      SEED_PASSWORD_B: ${SEED_PASSWORD_B:-Demo-B-2026!}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_RESPONSE_MODE: ${MODEL_RESPONSE_MODE:-json_schema}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-60}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-4000}
      ANALYSIS_WORKER_ENABLED: ${ANALYSIS_WORKER_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
